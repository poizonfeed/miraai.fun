<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mira Telegram chat home placeholder">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F4F8"/>
    </linearGradient>
  </defs>
  <rect width="320" height="680" fill="url(#bgC)"/>

  <!-- Status bar -->
  <text x="22" y="38" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">9:41</text>
  <g transform="translate(252,28)" fill="#0A0A0A">
    <rect x="0" y="4" width="14" height="10" rx="1.5"/>
    <rect x="18" y="2" width="22" height="14" rx="3" fill="none" stroke="#0A0A0A" stroke-width="1.4"/>
    <rect x="20" y="4" width="14" height="10" rx="1.5"/>
    <rect x="44" y="6" width="3" height="6" rx="1"/>
  </g>

  <!-- Top app bar -->
  <g transform="translate(0,64)">
    <text x="22" y="22" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A">×</text>
    <g transform="translate(112,4)">
      <text x="0" y="18" font-family="-apple-system, Inter, sans-serif" font-size="15" font-weight="700" fill="#0A0A0A">Mira</text>
      <circle cx="46" cy="13" r="6" fill="#3B82F6"/>
      <path d="M43 13 l3 3 l5 -6" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="34" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#9AA0AB">mini app</text>
    </g>
    <text x="282" y="22" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="700" fill="#0A0A0A">⋯</text>
  </g>

  <!-- Invite friends pill -->
  <g transform="translate(78,128)">
    <rect width="164" height="36" rx="18" fill="#F4F6FB" stroke="#E8EAF0"/>
    <g transform="translate(16,11)">
      <circle cx="7" cy="7" r="6" fill="none" stroke="#0A0A0A" stroke-width="1.4"/>
      <circle cx="16" cy="7" r="6" fill="none" stroke="#0A0A0A" stroke-width="1.4"/>
      <path d="M22 7 l4 0 m-2 -2 l0 4" stroke="#0A0A0A" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="58" y="23" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600" fill="#0A0A0A">Invite friends</text>
  </g>

  <!-- Hero question -->
  <g transform="translate(160,310)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, Inter, sans-serif" font-size="28" font-weight="700" fill="#0A0A0A">How I can</text>
    <text x="0" y="34" font-family="-apple-system, Inter, sans-serif" font-size="28" font-weight="700" fill="#0A0A0A">help you today?</text>
  </g>

  <!-- Ask anything input -->
  <g transform="translate(28,520)">
    <rect width="264" height="58" rx="28" fill="#FFFFFF" stroke="#E8EAF0"/>
    <text x="26" y="36" font-family="-apple-system, Inter, sans-serif" font-size="15" fill="#9AA0AB">Ask Anything…</text>
    <circle cx="234" cy="29" r="16" fill="#0A0A0A"/>
    <path d="M226 29 l8 -8 l8 8 M234 21 l0 16" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Home indicator -->
  <rect x="110" y="650" width="100" height="4" rx="2" fill="#0A0A0A" opacity="0.65"/>
</svg>
