<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mira Draw a picture skill placeholder">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F4F8"/>
    </linearGradient>
    <linearGradient id="thumbL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2D6F4"/>
      <stop offset="1" stop-color="#FBE3D6"/>
    </linearGradient>
  </defs>
  <rect width="320" height="680" fill="url(#bgL)"/>

  <!-- Status bar -->
  <text x="22" y="38" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">9:41</text>
  <g transform="translate(252,28)" fill="#0A0A0A">
    <rect x="0" y="4" width="14" height="10" rx="1.5"/>
    <rect x="18" y="2" width="22" height="14" rx="3" fill="none" stroke="#0A0A0A" stroke-width="1.4"/>
    <rect x="20" y="4" width="14" height="10" rx="1.5"/>
    <rect x="44" y="6" width="3" height="6" rx="1"/>
  </g>

  <!-- App bar -->
  <g transform="translate(0,64)">
    <text x="22" y="22" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="600" fill="#0A0A0A">×</text>
    <g transform="translate(126,4)">
      <text x="0" y="18" font-family="-apple-system, Inter, sans-serif" font-size="15" font-weight="700" fill="#0A0A0A">Mira</text>
      <circle cx="46" cy="13" r="6" fill="#3B82F6"/>
      <path d="M43 13 l3 3 l5 -6" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="282" y="22" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="700" fill="#0A0A0A">⋯</text>
  </g>

  <!-- Card -->
  <g transform="translate(20,140)">
    <rect width="280" height="320" rx="22" fill="#FFFFFF" stroke="#E8EAF0"/>
    <rect x="20" y="20" width="240" height="140" rx="16" fill="url(#thumbL)"/>
    <!-- Sketchy face on thumb -->
    <circle cx="140" cy="90" r="34" fill="none" stroke="#0A0A0A" stroke-width="1.5" opacity="0.6"/>
    <circle cx="130" cy="86" r="2.4" fill="#0A0A0A" opacity="0.7"/>
    <circle cx="150" cy="86" r="2.4" fill="#0A0A0A" opacity="0.7"/>
    <path d="M130 100 q10 8 20 0" stroke="#0A0A0A" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>

    <text x="20" y="190" font-family="-apple-system, Inter, sans-serif" font-size="18" font-weight="700" fill="#0A0A0A">Draw a picture</text>
    <text x="20" y="215" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#6B7280">Describe what you want to see…</text>
    <text x="20" y="244" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#0A0A0A">A soft Studio Ghibli-style portrait</text>
    <text x="20" y="262" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#0A0A0A">with warm light, gentle colors, and</text>
    <text x="20" y="280" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#0A0A0A">expressive eyes.</text>
  </g>

  <!-- Bottom input -->
  <g transform="translate(28,520)">
    <rect width="264" height="58" rx="28" fill="#FFFFFF" stroke="#E8EAF0"/>
    <text x="26" y="36" font-family="-apple-system, Inter, sans-serif" font-size="15" fill="#9AA0AB">Ask Anything…</text>
    <circle cx="234" cy="29" r="16" fill="#0A0A0A"/>
    <path d="M226 29 l8 -8 l8 8 M234 21 l0 16" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="110" y="650" width="100" height="4" rx="2" fill="#0A0A0A" opacity="0.65"/>
</svg>
